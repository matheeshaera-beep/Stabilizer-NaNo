name: Build Stabilizer-NaNo APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  ANDROID_NDK_VERSION: 27.2.12479018
  ANDROID_COMPILE_SDK: 35
  ANDROID_BUILD_TOOLS: 35.0.0

jobs:
  build:
    name: Build Rust Core & Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform, build-tools, and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Rust toolchain (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_core

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install cargo-ndk
        run: cargo binstall -y cargo-ndk

      - name: Run Rust unit tests and clippy
        working-directory: rust_core
        run: |
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings

      - name: Compile rust_core for arm64-v8a
        working-directory: rust_core
        run: |
          mkdir -p ../app/src/main/jniLibs
          cargo ndk -t arm64-v8a --platform 26 -o ../app/src/main/jniLibs build --release
          ls -lh ../app/src/main/jniLibs/arm64-v8a/librust_core.so

      - name: Generate UniFFI Kotlin bindings
        working-directory: rust_core
        run: |
          cargo run --features cli --bin uniffi-bindgen generate \
            --library ../app/src/main/jniLibs/arm64-v8a/librust_core.so \
            --language kotlin \
            --out-dir ../app/src/main/java \
            --no-format

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Bootstrap Gradle wrapper if needed and build debug APK
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload app-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish app-debug.apk to GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Stabilizer-NaNo {0}', github.ref_name) || 'Stabilizer-NaNo Latest' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/debug/app-debug.apk
