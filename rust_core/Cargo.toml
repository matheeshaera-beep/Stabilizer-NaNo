[package]
name = "rust_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "rust_core"
crate-type = ["lib", "cdylib"]

[features]
default = []
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["cli"]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.1"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
uniffi = { version = "0.32.2", features = ["tokio"] }
webpki-roots = "1.0"
